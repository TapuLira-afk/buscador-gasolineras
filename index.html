<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de gasolineras</title>
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./script/script.js" defer></script>
</head>

<body>
    <h1 id="tittle">Gasolineras España</h1>
    <section id="selecciones">
        <form id="form">
            <label for="provincias">
                <select name="provincias" id="provincias">
                    <option selected>Selecciona una opcion:</option>
                </select>
            </label>
            <label for="municipios">
                <select name="municipios" id="municipios">
                    <option selected>Selecciona una opcion:</option>
                </select>
            </label>
            <label for="combustibles">
                <select name="combustibles" id="combustibles">
                    <option selected>Selecciona una opcion:</option>
                </select>
            </label>
            <label for="abierto">
                <input type="checkbox" id="abierto">
                Abierto ahora
            </label>
            <button id="button" type="submit">Buscar</button>
        </form>
    </section>
    <section>
        
    </section>
</body>

</html>
